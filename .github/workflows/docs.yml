# Simple workflow for deploying static content to GitHub Pages
name: Typedoc Actions

on:
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

env:
  PACKAGE_MANAGER: 'npm'

jobs:
  deploy:
    name: Deploy Documentation

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: luolapeikko/github-actions/read-package-info@v0
      - uses: pnpm/action-setup@9b5745cdf0a2e8c2620f0746130f809adb911c19 # v4
        if: env.PACKAGE_MANAGER == 'pnpm'
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: ${{ env.PACKAGE_MANAGER }} install

      - name: Generate Documentation
        run: ${{ env.PACKAGE_MANAGER }} run docs

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./docs"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
